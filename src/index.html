<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-900 text-slate-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SQLite Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
    .action-btn {
      padding: 0.375rem 0.625rem;
      background-color: rgb(30 41 59);
      border: 1px solid rgb(51 65 85);
      border-radius: 0.375rem;
      font-size: 0.75rem;
      font-weight: 500;
      color: rgb(226 232 240);
      white-space: nowrap;
      transition: background-color 0.15s ease;
    }
    .action-btn:hover:not(:disabled) {
      background-color: rgb(51 65 85);
    }
    .action-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    tr.selected {
      background-color: rgba(99, 102, 241, 0.18) !important;
    }
  </style>
</head>
<body class="h-full w-full flex flex-col antialiased select-none font-sans overflow-hidden">

  <!-- Top Action Bar -->
  <header class="flex items-center justify-between gap-3 px-4 py-2.5 bg-slate-800 border-b border-slate-700/80 shadow-sm shrink-0 overflow-x-auto">
    <div class="flex items-center gap-2.5 shrink-0">

      <button id="btn-new-db" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-white rounded-md text-xs font-semibold shadow transition-colors flex items-center gap-1.5 shrink-0">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
        </svg>
        <span>New DB</span>
      </button>
      
      <button id="btn-open-db" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-md text-xs font-semibold shadow transition-colors flex items-center gap-2 shrink-0">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/>
        </svg>
        <span>Open DB</span>
      </button>
      <div class="relative shrink-0">
        <select id="table-select" class="w-48 bg-slate-900 border border-slate-700 text-xs text-slate-200 rounded-md px-2.5 py-1.5 focus:outline-none focus:ring-1 focus:ring-indigo-500 disabled:opacity-50" disabled>
          <option value="">No Database Loaded</option>
        </select>
      </div>
      <span id="active-db-path" class="text-xs text-slate-400 truncate max-w-xs" title="No file selected"></span>
    </div>

    <!-- Table & Row Operations -->
    <div class="flex items-center gap-1.5 shrink-0">
      <button id="btn-create-table" class="action-btn" disabled>+ New Table</button>
      <button id="btn-copy-table" class="action-btn" disabled>Copy Table</button>
      <button id="btn-drop-table" class="action-btn text-rose-400 hover:bg-rose-950/40 border-rose-900/60" disabled>Drop Table</button>
      <div class="h-4 w-px bg-slate-700 mx-1"></div>
      <button id="btn-add-column" class="action-btn" disabled>+ Column</button>
      <button id="btn-insert-row" class="action-btn bg-emerald-700/40 hover:bg-emerald-600/50 text-emerald-300 border-emerald-700/60" disabled>+ Row</button>
      <button id="btn-delete-rows" class="action-btn text-rose-400 hover:bg-rose-950/40 border-rose-900/60" disabled>Delete Selected</button>
    </div>
  </header>

  <!-- Bidirectional Scrollable Viewport -->
  <main class="flex-1 w-full overflow-auto bg-slate-950 relative" id="table-container">
    <div id="empty-state" class="h-full min-h-[300px] flex flex-col items-center justify-center text-slate-500 gap-2">
      <svg class="w-12 h-12 stroke-current opacity-40" viewBox="0 0 24 24" fill="none" stroke-width="1.5">
        <path d="M4 7V4h16v3M4 12h16M4 17h16M4 20h16" stroke-linecap="round"/>
      </svg>
      <p class="text-sm">Open a database to view and edit tables.</p>
    </div>
    
    <table id="data-table" class="w-full min-w-max text-left text-xs border-collapse hidden">
      <thead id="table-head" class="sticky top-0 bg-slate-800 text-slate-300 uppercase tracking-wider font-semibold border-b border-slate-700 z-10"></thead>
      <tbody id="table-body" class="divide-y divide-slate-800/80 font-mono"></tbody>
    </table>
  </main>

  <!-- Status Bar -->
  <footer class="px-4 py-1.5 bg-slate-900 border-t border-slate-800 text-[11px] text-slate-400 flex justify-between items-center shrink-0">
    <div id="status-left">Ready</div>
    <div id="status-right" class="flex gap-4">
      <span id="row-count">0 rows</span>
      <span id="selection-count">0 selected</span>
    </div>
  </footer>

  <!-- Unified Dynamic Modal Container -->
  <div id="modal-backdrop" class="fixed inset-0 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-slate-800 border border-slate-700 rounded-lg shadow-2xl p-5 w-[460px] max-w-full max-h-[85vh] text-slate-100 flex flex-col">
      <h3 id="modal-title" class="text-sm font-semibold text-slate-200 pb-2 shrink-0">Modal Action</h3>
      <div id="modal-body" class="space-y-3 overflow-y-auto my-2 pr-1 flex-1"></div>
      <div class="flex justify-end gap-2 pt-3 border-t border-slate-700 shrink-0">
        <button id="modal-cancel-btn" class="px-3 py-1.5 rounded-md bg-slate-700 hover:bg-slate-600 text-xs font-medium transition">Cancel</button>
        <button id="modal-confirm-btn" class="px-3 py-1.5 rounded-md bg-indigo-600 hover:bg-indigo-500 text-xs font-medium transition">Confirm</button>
      </div>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
